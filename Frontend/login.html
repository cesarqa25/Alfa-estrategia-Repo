<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Colegio Arzobispado</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" href="./Imagenes/logo-chico.png">
</head>
<body>
    <img src="./Imagenes/pantalla_completa_1980x1080px/PANTALLA COMPLETA_-04.png" alt="plantilla">
    <form>
        <img src="https://colegiosarzobispado.cl/wp-content/uploads/2025/07/logo-texto.png" alt="Logo Colegio Arzobispado" title="Logo Colegio Arzobispado">
        <h2>Iniciar Sesion</h2>
        <label for="text">RUT</label>
        <input type="text" id="rut" placeholder="Ej: 12345678-k" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
        <div class="button-check">
            <input type="checkbox" id="ShowPassword">
            <label for="ShowPassword" class="label-check">Mostrar Contraseña</label>
        </div>
        <p id="loginMsg" class="msg" role="alert" aria-live="polite"></p>
       
        <button type="submit" id="submit">Ingresar</button>
        
    </form>
    <script src="./js/Login.js"></script>
</body>
</html>
